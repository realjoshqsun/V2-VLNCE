BASE_TASK_CONFIG_PATH: run_rxr/rxr_vlnce.yaml
SIMULATOR_GPU_IDS: [0]
TORCH_GPU_ID: 0
TORCH_GPU_IDS: [0]
TRAINER_NAME: VIL-ETP-Trainer-final
GPU_NUMBERS: 1
NUM_ENVIRONMENTS: 1
TENSORBOARD_DIR: data/logs/tensorboard_dirs/
CHECKPOINT_FOLDER: data/logs/checkpoints/
EVAL_CKPT_PATH_DIR: data/logs/checkpoints/
RESULTS_DIR: data/logs/eval_results/
VIDEO_DIR: data/logs/video/

INFERENCE:
  SPLIT: test_challenge
  LANGUAGES: ['*']
  USE_CKPT_CONFIG: False
  CKPT_PATH: ''  # REPLACE THIS
  PREDICTIONS_FILE: ''
  FORMAT: rxr
  EPISODE_COUNT: -1

EVAL:
  USE_CKPT_CONFIG: False
  SPLIT: val_unseen
  # LANGUAGES: [en-US, en-IN]
  LANGUAGES: ['*']
  EPISODE_COUNT: -1
  CKPT_PATH_DIR: ''
  fast_eval: False

# RL:
#   POLICY:
#     OBS_TRANSFORMS:
#       ENABLED_TRANSFORMS: [ResizerPerSensor, CenterCropperPerSensor]

IL:
  iters: 20000
  log_every: 50
  lr: 1e-5
  batch_size: 1 # equal to NUM_ENVIRONMENTS

  ml_weight: 1.0
  cl_weight: 0.2
  wpd_weight: 8.0
  
  expert_policy: ndtw

  sample_ratio: 0.75
  decay_interval: 3000
  
  max_traj_len: 25
  max_text_len: 200
  loc_noise: 0.5
  waypoint_aug: False
  ghost_aug: 0.0
  back_algo: teleport
  # back_algo: control
  tryout: True

  view_sampling: height_angle_2d_uniform
  max_height_shift: 0.5
  max_angle_shift: 30
  resample_interval: 50


MODEL:
  task_type: rxr

  policy_name: PolicyVIL_ETP
  NUM_ANGLES: 12
  pretrained_path: data/logs/checkpoints/release_rxr/ckpt.iter19600.pth
  fix_lang_embedding: False
  fix_pano_embedding: False
  use_depth_embedding: True
  use_sprels: True
  merge_ghost: True
  consume_ghost: True
  
  temperature: 1.0
  keep_origin_view_prob: 0.5
  keep_origin_view_wp_prob: 0.5

  spatial_output: False
  RGB_ENCODER:
    output_size: 512
  DEPTH_ENCODER:
    output_size: 256    
  VISUAL_DIM:
    vis_hidden: 768
    directional: 128
  INSTRUCTION_ENCODER:
    bidirectional: True
    sensor_uuid: rxr_instruction
    embedding_size: 768

